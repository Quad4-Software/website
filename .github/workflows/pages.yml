# Deploys the site to GitHub Pages on every push to master. Requires repo
# Settings -> Pages -> Build and deployment -> GitHub Actions. The site is
# plain HTML and CSS at the repo root, so there is no build step.
name: GitHub Pages

on:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read # checkout
      pages: write # create the pages deployment
      id-token: write # authenticate to the pages api
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde # v2.9.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Stage site
        run: |
          mkdir _site
          git ls-files -z | tar --null -cf - --files-from - | tar -xf - -C _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
