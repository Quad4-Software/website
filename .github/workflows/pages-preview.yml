# Pull request previews on GitHub Pages. Requires repo Settings -> Pages ->
# Build and deployment -> Deploy from a branch -> gh-pages /. The action
# creates the gh-pages branch on the first deploy. Previews land at
# https://quad4-software.github.io/website/pr-preview/pr-<n>/ and are removed
# when the pull request closes. Fork pull requests are skipped because their
# token cannot write to gh-pages.
name: Pages preview

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, closed]

permissions: {}

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the preview to the gh-pages branch
      pull-requests: write # comment the preview url on the pull request
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde # v2.9.1
        with:
          egress-policy: audit

      - name: Checkout
        if: github.event.action != 'closed'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        if: github.event.action != 'closed'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile

      - name: Build with preview base path
        if: github.event.action != 'closed'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm exec astro build --base "/${REPO_NAME}/pr-preview/pr-${PR_NUMBER}"

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ./dist/
          preview-branch: gh-pages
          qr-code: false
