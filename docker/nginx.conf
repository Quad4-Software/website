server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Q0c3WPpsOy9ZtBiFQSJAFz4TIa4pEYE3TzAqW9fXC5I=' 'sha256-8TfhfxIj2Zz6EoTVnrGR0f6XgeLD5jg0eLYhZkIP35E='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Dotfiles and host-metadata files (_headers, _redirects) are not served.
    location ~ (^|/)[._] {
        return 404;
    }

    # Hashed build assets are immutable.
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Public media gets a medium cache.
    location ~* \.(?:woff2|woff|webp|png|ico|svg)$ {
        expires 30d;
        try_files $uri =404;
    }

    # SPA fallback. HTML is always revalidated.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
