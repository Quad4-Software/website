server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/json image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # WebFinger (RFC 7033): OIDC issuer discovery for quad4.io accounts.
    location = /.well-known/webfinger {
        default_type application/jrd+json;
        expires -1;
    }

    # Dotfiles and host-metadata files (_headers, _redirects) are not served.
    location ~ (^|/)[._] {
        return 404;
    }

    # Vendored fonts are immutable.
    location ^~ /fonts/ {
        expires 1y;
        try_files $uri =404;
    }

    # Public media gets a medium cache.
    location ~* \.(?:woff2|woff|webp|png|ico|svg)$ {
        expires 30d;
        try_files $uri =404;
    }

    # Multi-page static output. HTML is always revalidated.
    error_page 404 /404.html;
    location / {
        expires -1;
        try_files $uri $uri/index.html $uri/ =404;
    }
}
